<svg xmlns="http://www.w3.org/2000/svg" width="1008" height="928" viewBox="0 0 1008 928">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; fill:#2b2f33; }
      .title { font-size:28px; fill:#ffffff; }
      .h2 { font-size:24px; }
      .body { font-size:21px; }
      .small { font-size:16px; }
      .label { font-size:21px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1008" height="928" fill="#f6f6f6"/>

  <!-- Header -->
  <rect x="1" y="4" width="1000" height="78" rx="2" fill="#0b7dbc"/>
  <text x="21" y="51" class="font title">Questionnaires</text>
  <text x="965" y="49" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#86c5e7">×</text>

  <!-- Card 1 -->
  <rect x="21" y="102" width="960" height="157" rx="4" fill="#ffffff" filter="url(#shadow)"/>
  <text x="46" y="153" class="font h2">Télécontrôle assuré(e)</text>
  <text x="46" y="186" class="font body">Nom: Convocation Service médical</text>
  <text x="46" y="216" class="font body">Date: 31.08.2026 12:00 (heure de Paris)</text>

  <!-- Card 2 -->
  <rect x="21" y="270" width="960" height="658" rx="4" fill="#ffffff" filter="url(#shadow)"/>
  <text x="46" y="321" class="font h2">Questions préalables à la réunion</text>
  <text x="46" y="363" class="font body">Objet du télécontrôle</text>

  <!-- Radios -->
  <g class="font body">
    <circle cx="53" cy="392" r="7" fill="none" stroke="#7b7b7b" stroke-width="1.4"/>
    <text x="71" y="401">Arrêt de travail</text>

    <circle cx="53" cy="423" r="7" fill="none" stroke="#7b7b7b" stroke-width="1.4"/>
    <text x="71" y="432">Reconnaissance maladie professionnelle</text>

    <circle cx="53" cy="453" r="7" fill="none" stroke="#7b7b7b" stroke-width="1.4"/>
    <text x="71" y="462">Demande d’accord préalable</text>

    <circle cx="53" cy="483" r="7" fill="none" stroke="#7b7b7b" stroke-width="1.4"/>
    <text x="71" y="492">Autre</text>
  </g>

  <!-- Fields -->
  <text x="46" y="542" class="font label">Nom de l'assuré(e)</text>
  <rect x="46" y="560" width="909" height="46" rx="4" fill="#ffffff" stroke="#c8d0d8"/>

  <text x="46" y="648" class="font label">Prénom de l'assuré(e)</text>
  <rect x="46" y="666" width="909" height="48" rx="4" fill="#ffffff" stroke="#c8d0d8"/>

  <text x="46" y="757" class="font label">Code postal de l’assuré(e)</text>
  <rect x="46" y="775" width="909" height="46" rx="4" fill="#ffffff" stroke="#c8d0d8"/>

  <!-- Buttons -->
  <rect x="53" y="849" width="148" height="58" rx="2" fill="#0565bf" filter="url(#shadow)"/>
  <text x="127" y="884" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ffffff">VALIDER</text>

  <rect x="801" y="850" width="146" height="54" rx="2" fill="#ffffff" stroke="#ff2441" stroke-width="2"/>
  <text x="874" y="882" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#ff2441">RETOUR</text>
</svg>